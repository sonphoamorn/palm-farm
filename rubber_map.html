<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🌿 แผนที่สวนยางพารา</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500&family=Mitr:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--g0:#0d1f16;--g3:#2d6a4f;--g4:#52b788;--ink:#e0e0e0;--ink3:#95d5b2;--red:#e76f51;--amber:#e9c46a;--sky:#a8dadc}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;background:var(--g0);color:var(--ink);font-family:'Sarabun',sans-serif;overflow:hidden;user-select:none}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
#header{background:#0a1810;padding:9px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--g3)}
#header h1{font-family:'Mitr',sans-serif;font-size:15px;color:var(--g4)}
#stats{font-size:11px;color:var(--ink3);text-align:right;line-height:1.5}
#filter{background:#0a1810;padding:5px 8px;display:flex;gap:5px;flex-wrap:wrap;border-bottom:1px solid var(--g3);align-items:center}
.fbtn{padding:4px 10px;border-radius:12px;border:1px solid var(--g3);background:transparent;color:var(--g4);font-size:11px;cursor:pointer;font-family:'Sarabun',sans-serif;transition:all .15s}
.fbtn.active{background:var(--g3);color:#fff}
.row-btn{padding:3px 8px;border-radius:10px;border:2px solid;background:transparent;font-size:10px;cursor:pointer;font-family:'Sarabun',sans-serif;transition:all .15s;font-weight:600}
.row-btn.active{color:#fff!important}
#mapWrap{flex:1;position:relative;overflow:hidden}
canvas{position:absolute;left:0;top:0;touch-action:none}
#info{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(10,24,16,.95);border:1px solid var(--g3);border-radius:10px;padding:8px 14px;min-width:210px;max-width:90vw;display:none;font-size:12px;z-index:10}
#info h4{font-family:'Mitr',sans-serif;font-size:13px;color:var(--g4);margin-bottom:4px}
#info p{color:var(--ink3);line-height:1.7}
.badge{display:inline-block;background:var(--red);color:#fff;border-radius:4px;padding:1px 6px;font-size:10px;margin-top:2px}
#legend{position:absolute;top:8px;right:8px;background:rgba(10,24,16,.9);border:1px solid var(--g3);border-radius:8px;padding:7px 10px;font-size:11px;color:var(--ink3);line-height:1.9;z-index:10}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.sq{display:inline-block;width:8px;height:8px;margin-right:5px;vertical-align:middle}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <h1>🌿 แผนที่สวนยางพารา — สวนลุงสน</h1>
    <div id="stats">ทั้งหมด <b style="color:var(--g4)">187</b> ต้น | ต้องซ่อม <b style="color:var(--red)">68</b> ต้น<br><span style="font-size:10px;opacity:.7">สำรวจแล้ว ~60%</span></div>
  </div>
  <div id="filter">
    <button class="fbtn active" onclick="setFilter('all',this)">ทั้งหมด</button>
    <button class="fbtn" onclick="setFilter('repair',this)">🔴 ต้องซ่อม</button>
    <button class="fbtn" onclick="setFilter('ok',this)">🟢 ปกติ</button>
    <span style="color:var(--g3);margin:0 2px">|</span>
    <span id="rowBtns"></span>
  </div>
  <div id="mapWrap">
    <canvas id="mapCanvas"></canvas>
    <div id="info">
      <h4 id="iTitle">—</h4>
      <p id="iBody">—</p>
    </div>
    <div id="legend">
      <span class="dot" style="background:#fff;border:2px solid #888"></span>ปกติ<br>
      <span class="dot" style="background:var(--red)"></span>ต้องซ่อม<br>
      <span class="sq" style="background:var(--amber)"></span>หัวแถว (H)<br>
      <span class="sq" style="background:var(--sky)"></span>ท้ายแถว (T)<br>
      <span style="font-size:10px;opacity:.6">— เส้น = แถว</span>
    </div>
  </div>
</div>

// 14 distinct row colors
const ROW_COLORS = [
  '#52b788','#e9c46a','#a8dadc','#f4a261','#e76f51',
  '#74c69d','#ffd166','#06d6a0','#118ab2','#ef476f',
  '#b7e4c7','#ffb703','#8ecae6','#fb8500'
];
const ROWS = [...new Set(TREES.map(t=>t.row))].sort((a,b)=>
  parseInt(a.match(/\d+/)[0])-parseInt(b.match(/\d+/)[0]));
const ROW_COLOR = {};
ROWS.forEach((r,i)=>ROW_COLOR[r]=ROW_COLORS[i%ROW_COLORS.length]);

// Build row filter buttons
const rbWrap = document.getElementById('rowBtns');
ROWS.forEach(r=>{
  const btn = document.createElement('button');
  btn.className='row-btn';
  btn.textContent=r;
  btn.style.borderColor=ROW_COLOR[r];
  btn.style.color=ROW_COLOR[r];
  btn.onclick=()=>setRowFilter(r,btn);
  rbWrap.appendChild(btn);
});

const cvs = document.getElementById('mapCanvas');
const ctx = cvs.getContext('2d');
let W=0,H=0,filter='all',rowFilter=null,selIdx=null;

function resize(){
  const wrap=document.getElementById('mapWrap');
  W=cvs.width=wrap.clientWidth; H=cvs.height=wrap.clientHeight;
  draw();
}

function getBounds(){
  const lats=TREES.map(t=>t.lat),lngs=TREES.map(t=>t.lng);
  return{minLat:Math.min(...lats),maxLat:Math.max(...lats),minLng:Math.min(...lngs),maxLng:Math.max(...lngs)};
}

function toXY(lat,lng,b){
  const pad=0.08;
  const dLng=b.maxLng-b.minLng||.001,dLat=b.maxLat-b.minLat||.001;
  return{
    x:(lng-b.minLng)/dLng*(W*(1-2*pad))+W*pad,
    y:(1-(lat-b.minLat)/dLat)*(H*(1-2*pad))+H*pad
  };
}

function visible(t){
  if(rowFilter && t.row!==rowFilter) return false;
  if(filter==='repair') return t.repair;
  if(filter==='ok') return !t.repair;
  return true;
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0d1f16'; ctx.fillRect(0,0,W,H);
  const b=getBounds();

  // Draw row lines first (background)
  ROWS.forEach(row=>{
    const pts=TREES.filter(t=>t.row===row && visible(t))
               .sort((a,c)=>a.no-c.no)
               .map(t=>toXY(t.lat,t.lng,b));
    if(pts.length<2) return;
    const col=ROW_COLOR[row];
    const isActive=!rowFilter||rowFilter===row;
    ctx.beginPath();
    pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
    ctx.strokeStyle=isActive?col+'99':col+'22';
    ctx.lineWidth=isActive?2:1;
    ctx.stroke();
  });

  // Draw row labels at midpoint
  ROWS.forEach(row=>{
    const pts=TREES.filter(t=>t.row===row)
               .sort((a,c)=>a.no-c.no)
               .map(t=>toXY(t.lat,t.lng,b));
    if(!pts.length) return;
    const mid=pts[Math.floor(pts.length/2)];
    const col=ROW_COLOR[row];
    const isActive=!rowFilter||rowFilter===row;
    ctx.font='bold 11px Mitr,Sarabun,sans-serif';
    ctx.textAlign='center';
    ctx.fillStyle=isActive?col:'rgba(255,255,255,.15)';
    ctx.fillText(row, mid.x, mid.y-10);
  });

  // Draw trees
  TREES.forEach((t,i)=>{
    if(!visible(t)) return;
    const {x,y}=toXY(t.lat,t.lng,b);
    const col=ROW_COLOR[t.row];
    const isSel=selIdx===i;
    const isHT=t.pt==='H'||t.pt==='T';
    const r=isHT?6:4;

    if(isSel){
      ctx.beginPath(); ctx.arc(x,y,r+6,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,.2)'; ctx.fill();
    }

    if(isHT){
      // Square for H/T
      const s=r;
      ctx.fillStyle=t.pt==='H'?'#e9c46a':'#a8dadc';
      ctx.fillRect(x-s,y-s,s*2,s*2);
      if(isSel){ ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.strokeRect(x-s-2,y-s-2,s*2+4,s*2+4); }
    } else {
      // Circle: outline=row color, fill=white or red
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fillStyle=t.repair?'#e76f51':'rgba(255,255,255,.85)';
      ctx.fill();
      ctx.strokeStyle=col;
      ctx.lineWidth=1.5; ctx.stroke();
      if(isSel){
        ctx.beginPath(); ctx.arc(x,y,r+3,0,Math.PI*2);
        ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();
      }
    }
  });
}

function onTap(e){
  e.preventDefault();
  const r=cvs.getBoundingClientRect();
  const src=e.touches?e.changedTouches[0]:e;
  const mx=src.clientX-r.left, my=src.clientY-r.top;
  const b=getBounds();
  let best=null,bestD=28;
  TREES.forEach((t,i)=>{
    if(!visible(t)) return;
    const p=toXY(t.lat,t.lng,b);
    const d=Math.hypot(mx-p.x,my-p.y);
    if(d<bestD){bestD=d;best=i;}
  });
  selIdx=best;
  const info=document.getElementById('info');
  if(best!==null){
    const t=TREES[best];
    const ptLabel=t.pt==='H'?'🟡 หัวแถว (H)':t.pt==='T'?'🔵 ท้ายแถว (T)':'ต้นยาง';
    const col=ROW_COLOR[t.row];
    document.getElementById('iTitle').innerHTML=`<span style="color:${col}">${t.row}</span> — ต้นที่ ${t.no}`;
    document.getElementById('iBody').innerHTML=`ประเภท: ${ptLabel}${t.repair?'<br><span class="badge">⚠️ ต้องซ่อม</span>':''}`;
    info.style.display='block';
  } else {
    info.style.display='none';
  }
  draw();
}

function setFilter(f,btn){
  filter=f; selIdx=null;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('info').style.display='none';
  draw();
}

function setRowFilter(r,btn){
  if(rowFilter===r){
    rowFilter=null;
    document.querySelectorAll('.row-btn').forEach(b=>b.classList.remove('active'));
  } else {
    rowFilter=r; selIdx=null;
    document.querySelectorAll('.row-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    btn.style.background=ROW_COLOR[r];
  }
  document.getElementById('info').style.display='none';
  draw();
}

window.addEventListener('resize',resize);
cvs.addEventListener('click',onTap);
cvs.addEventListener('touchend',onTap,{passive:false});
resize();
</script>
</body>
